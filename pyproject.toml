[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webapptemplate"
version = "0.2.0"
description = "Reusable Django webapp template: users, workspaces, API, auth, subscriptions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Django>=6.0.4,<6.1",
    "django-allauth[socialaccount]>=65.15.0,<66",
    "django-ninja>=1.6.2,<2",
    "whitenoise>=6.12.0,<7",
    "psycopg2-binary>=2.9.11,<3",
    "python-decouple>=3.8,<4",
    "Pillow>=12.3,<13",
    "gunicorn>=25.3.0,<26",
    "redis>=7.4.0,<8",
    "django-redis>=6.0.0,<7",
]

[project.scripts]
webapptemplate = "webapptemplate.installer.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/webapptemplate"
Repository = "https://github.com/your-org/webapptemplate"

[tool.hatch.build.targets.wheel]
packages = ["webapptemplate"]

[tool.hatch.build]
include = [
    "webapptemplate/**",
    "templates/**",
    "static/**",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/migrations/__pycache__",
]
